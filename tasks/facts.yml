---
- name: Facts | Gather minimal system facts
  ansible.builtin.setup:
    gather_subset: [min]
  register: _ea_setup
  until: _ea_setup is not failed
  retries: "{{ elastic_agent_task_retries }}"
  delay: "{{ elastic_agent_task_delay }}"
  when: ansible_facts['os_family'] is not defined

# dpkg-query prints the selection and state too: '<want> ok installed <version>'
# for an installed package, 'deinstall ok config-files <version>' once removed.
- name: Facts | Query installed Elastic Agent package version  # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: "{{ _ea_pkg_version_cmd }}"
  register: _ea_pkg_query
  changed_when: false
  failed_when: false
  check_mode: false

- name: Facts | Query Elastic Agent service state  # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: systemctl is-active elastic-agent
  register: _ea_service_state
  changed_when: false
  failed_when: false
  check_mode: false

- name: Facts | Check for an existing Fleet enrollment
  ansible.builtin.stat:
    path: "{{ _ea_fleet_enc_file }}"
  register: _ea_fleet_enc

- name: Facts | Check whether this host is a Fleet Server
  ansible.builtin.stat:
    path: "{{ _ea_fleet_server_state_file }}"
  register: _ea_fleet_server_state

- name: Facts | Read the recorded enrollment state
  ansible.builtin.slurp:
    src: "{{ _ea_state_file }}"
  register: _ea_state_raw
  failed_when: false

- name: Facts | Set Elastic Agent facts
  ansible.builtin.set_fact:
    _ea_installed_version: >-
      {{ '' if _ea_pkg_query.rc != 0
         else (_ea_pkg_query.stdout | trim) if ansible_facts['os_family'] != 'Debian'
         else (_ea_pkg_query.stdout.split() | last) if ' ok installed ' in _ea_pkg_query.stdout
         else '' }}
    _ea_is_running: "{{ (_ea_service_state.stdout | trim) == 'active' }}"
    _ea_state: >-
      {{ (_ea_state_raw.content | b64decode | from_json) if _ea_state_raw.content is defined else {} }}
    _ea_restart_required: false

# Enrolled by this role: Fleet's own state file exists and the role recorded
# the settings it enrolled with. Anything else is enrolled from scratch.
- name: Facts | Derive version and enrollment facts
  ansible.builtin.set_fact:
    _ea_version_changing: "{{ (_ea_installed_version | length) > 0 and _ea_installed_version != elastic_agent_version }}"
    _ea_is_enrolled: "{{ _ea_fleet_enc.stat.exists and (_ea_state.fingerprint | default('') | length) > 0 }}"
