---
# =============================================================================
# Platform
# =============================================================================
# Distributions accepted by preflight, as reported by ansible_facts['distribution'].
# Enterprise Linux 9 and 10 and Ubuntu 24.04 and 26.04 are supported. Other
# Enterprise Linux rebuilds, such as CentOS (Stream) or OracleLinux, can be added
# here but are not tested.
elastic_agent_supported_distributions:
  - RedHat
  - AlmaLinux
  - Rocky
  - Ubuntu

# =============================================================================
# Package / repository
# =============================================================================
# The repository and package tasks are ansible-role-elastic-fleet's own, run
# with the values below, so both roles configure the same repository file in
# the same way. That role has to be installed (requirements.yml), under the
# name given here.
elastic_agent_fleet_role: elastic_fleet

# Exact 9.x release of the elastic-agent package. Must not be newer
# (major.minor) than Fleet Server. Changing it upgrades the package with dnf or
# apt and restarts the agent: Fleet cannot upgrade an agent installed from an
# RPM or Debian package.
elastic_agent_version: "9.5.4"

# Where the elastic-agent package comes from: elastic, satellite or none. The
# options are those of ansible-role-elastic-fleet (elastic_fleet_repo_*).
elastic_agent_repo_source: elastic

# --- elastic_agent_repo_source: elastic ---
# The yum repository on Enterprise Linux, the apt one (suite stable, component main) on Ubuntu.
elastic_agent_repo_baseurl: >-
  https://artifacts.elastic.co/packages/{{ elastic_agent_version.split('.')[0] }}.x/{{ 'apt' if ansible_facts['os_family'] == 'Debian' else 'yum' }}
elastic_agent_repo_gpgkey: "https://artifacts.elastic.co/GPG-KEY-elasticsearch"
elastic_agent_repo_gpgcheck: true

# --- elastic_agent_repo_source: satellite (Enterprise Linux only) ---
elastic_agent_satellite_repo_id: ""
# unmanaged, enabled or disabled
elastic_agent_satellite_repo_state: unmanaged
elastic_agent_satellite_repo_overrides: {}
elastic_agent_satellite_refresh: true
elastic_agent_satellite_gpgkey: ""

# Before installing or upgrading, check that elastic_agent_version is available
# from the package source. Catches Satellite content views that were not promoted.
elastic_agent_package_version_check: true

# =============================================================================
# Paths
# =============================================================================
# Fixed by the RPM package.
elastic_agent_conf_dir: /etc/elastic-agent
# CA and client certificate files this role installs.
elastic_agent_ssl_dir: /etc/elastic-agent/certs

# =============================================================================
# Fleet
# =============================================================================
# Inventory group of the Fleet Servers (ansible-role-elastic-fleet's
# elastic_fleet_group). Used for the defaults below and for the version check.
elastic_agent_fleet_group: fleet_server
elastic_agent_fleet_port: 8220

# Fleet Server URL the agent enrolls through. By default the first of:
#   - elastic_fleet_enrollment_urls, published by ansible-role-elastic-fleet on
#     the Fleet Server hosts when it ran earlier in the same run;
#   - elastic_fleet_public_urls, when the inventory sets it for those hosts;
#   - the first host of elastic_agent_fleet_group on elastic_agent_fleet_port.
# After enrolling, agents use the Fleet Server hosts registered in Fleet.
elastic_agent_fleet_url: "{{ _ea_default_fleet_url }}"

# Agent policy to enroll into. Used to find the enrollment token, and recorded
# with the enrollment so that changing it re-enrolls the agent. The policy has
# to exist: this role does not create policies. ansible-role-elastic-fleet
# creates agent-policy by default (elastic_fleet_agent_policies).
elastic_agent_policy_id: agent-policy

# Enrollment token (vault). When empty the role uses, in order:
#   1. the token ansible-role-elastic-fleet published for elastic_agent_policy_id
#      in this run (elastic_fleet_enrollment_tokens on the Fleet Server hosts);
#   2. an active token of elastic_agent_policy_id read from Kibana's Fleet API,
#      with the elastic_agent_kibana_* credentials below.
elastic_agent_enrollment_token: ""

# Tags shown in Fleet, set when the agent enrolls. Changing them re-enrolls it.
elastic_agent_tags: []

# Extra arguments appended to `elastic-agent enroll`, e.g. ["--proxy-url=http://proxy:3128"]
elastic_agent_enroll_extra_args: []

# Re-enroll a running agent when its enrollment settings change (Fleet URL,
# policy, CA, client certificate, tags, extra arguments). Re-enrolling gives the
# agent a new id in Fleet; the old one shows as offline until it is removed.
# A new enrollment token on its own does not re-enroll.
elastic_agent_reenroll_on_change: true

# Seconds enroll may take before it is abandoned.
elastic_agent_enroll_timeout: 300

# =============================================================================
# TLS
# =============================================================================
# Entry looked up by name in `ssl_certificates` and then in
# `elastic_tls_ssl_certificates` (published by ansible-role-elastic-tls). Its
# `ca` is the CA the agent trusts Fleet Server with.
elastic_agent_ssl_certificate_name: "{{ inventory_hostname }}"
# PEM CA that issued the Fleet Server certificates, when the entry has no ca.
# With neither, ansible-role-elastic-tls's elastic_tls_ca_certificate is used,
# and failing that the system trust store (e.g. a Let's Encrypt certificate).
elastic_agent_ssl_ca_certificate: ""
# Path to a CA file already on the host, as an alternative to the content above.
elastic_agent_ssl_ca_certificate_path: ""

# Present the entry's certificate and key to Fleet Server (mutual TLS), for
# Fleet Servers with elastic_fleet_client_auth optional or required.
elastic_agent_client_certificate: false

# Check, before enrolling, that Fleet Server answers on elastic_agent_fleet_url
# through the CA above and reports itself healthy.
elastic_agent_fleet_check: true

# =============================================================================
# Kibana (only to look up enrollment tokens)
# =============================================================================
elastic_agent_kibana_group: kibana
elastic_agent_kibana_url: "https://{{ (groups[elastic_agent_kibana_group] | default(['localhost'])) | first }}:5601"
# Credentials of a user allowed to read Fleet enrollment tokens (vault): an API
# key (base64 "id:api_key", sent as "ApiKey ...") or a user name and password.
elastic_agent_kibana_api_key: ""
elastic_agent_kibana_username: elastic
elastic_agent_kibana_password: ""
# PEM CA for Kibana's certificate. Empty = the Fleet Server CA.
elastic_agent_kibana_ca_certificate: ""
elastic_agent_kibana_ca_certificate_path: ""

# =============================================================================
# Operation
# =============================================================================
# Restart a running agent when its CA or client certificate changes.
elastic_agent_restart_on_change: true
elastic_agent_force_restart: false

# After enrolling, starting or restarting, wait until `elastic-agent status`
# reports the agent connected to Fleet and in one of these states.
elastic_agent_ready_states: [HEALTHY]
elastic_agent_ready_retries: 60
elastic_agent_ready_delay: 5

# =============================================================================
# Network resilience (high-latency / low-bandwidth links)
# =============================================================================
elastic_agent_task_retries: 3
elastic_agent_task_delay: 15
# Package downloads run as async jobs so they keep running if SSH drops.
elastic_agent_download_async_timeout: 3600
elastic_agent_download_async_poll: 15
elastic_agent_repo_timeout: 120
elastic_agent_repo_retries: 10
# Seconds to wait for the dnf or apt lock
elastic_agent_dnf_lock_timeout: 300
# Per-request HTTP timeout (seconds) for Fleet Server and Kibana
elastic_agent_api_timeout: 30

elastic_agent_no_log: true
