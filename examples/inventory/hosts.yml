---
all:
  children:
    elastic_agent:
      hosts:
        web-1.example.com:
        web-2.example.com:
        db-1.example.com:
    # Not managed by this playbook. The agents enroll through Fleet Server
    # (the first host's elastic_fleet_public_urls, from group_vars) and look
    # their enrollment token up through the first Kibana host when it was not
    # published in this run.
    fleet_server:
      hosts:
        fleet-1.example.com:
        fleet-2.example.com:
    kibana:
      hosts:
        kb-1.example.com:
    # ansible-role-elastic-tls keeps its CA on the first Elasticsearch host
    # (elastic_tls_ca_host); without this group it would pick an agent.
    elasticsearch:
      hosts:
        es-data-1.example.com:
