---
# Installs this role, the roles it uses and their collections for the example
# playbook:
#   ansible-galaxy install -r requirements.yml
roles:
  - name: elastic_agent
    src: https://github.com/jmaughmer/ansible-role-elastic-agent.git
    scm: git
    version: main
  # Its repository and package tasks are used by elastic_agent.
  - name: elastic_fleet
    src: https://github.com/jmaughmer/ansible-role-elastic-fleet.git
    scm: git
    version: main
  - name: elastic_tls
    src: https://github.com/jmaughmer/ansible-role-elastic-tls.git
    scm: git
    version: main

collections:
  - name: ansible.posix
    version: ">=1.5.0"
  - name: community.crypto
    version: ">=2.10.0"
