---
# Settings shared by both agents; host_vars set how each gets its token.
elastic_agent_tags: [molecule]

# The role would take this from elastic_fleet_public_urls in the Fleet Server
# group_vars, but that is built from hostvars, which Ansible cannot resolve
# when it is itself read through hostvars. Real inventories give the URL as
# text, and ansible-role-elastic-fleet publishes it as a plain fact.
elastic_agent_fleet_url: "https://{{ test_fleet_address }}:8220"

# Show what was sent if a run fails.
elastic_agent_no_log: false
# Retry less: a failure in a container is not a flaky satellite link.
elastic_agent_task_retries: 2
elastic_agent_task_delay: 5
elastic_agent_download_async_poll: 5
