---
# The first agent (agent1 in each scenario): token looked up in Kibana;
# client certificate (the elastic_tls one, named after the host) presented to
# Fleet Server. A group rather than host_vars, so the scenarios can name their
# hosts; it sorts after elastic_agent, so its elastic_agent_tags win.
elastic_agent_policy_id: molecule-a
elastic_agent_kibana_url: "{{ test_kibana_url }}"
elastic_agent_kibana_username: "{{ test_admin_user }}"
elastic_agent_kibana_password: "{{ test_admin_password }}"
elastic_agent_client_certificate: true
elastic_agent_tags: [molecule, mtls]
