---
# Five systemd containers (rootless Podman is fine) on one network:
#   agent-default-es      Elasticsearch, single node, installed by prepare.yml;
#                         also the CA host of ansible-role-elastic-tls
#   agent-default-kb      Kibana, installed by prepare.yml
#   agent-default-fleet   Fleet Server, deployed by ansible-role-elastic-fleet
#                         in prepare.yml
#   agent-default-agent1  the inventory group "elastic_agent", which the role
#   agent-default-agent2  is applied to; agent1 is also in test_agent_mtls,
#                         agent2 in test_agent_token
# The playbooks and inventory find the hosts by group, and every scenario
# names its hosts and network after itself, so scenarios can run at the same
# time.
# MOLECULE_EL picks the AlmaLinux release of the almalinux/<release>-init
# image (default 9; also 10). Certificates come from ansible-role-elastic-tls
# everywhere, as in a real deployment. Ansible connects as root, so the
# playbooks do not use become: the images have no sudo.
role_name_check: 1

dependency:
  name: galaxy   # installs requirements.yml next to this file

driver:
  name: podman

platforms:
  - name: agent-default-es
    image: "docker.io/almalinux/${MOLECULE_EL:-9}-init:latest"
    pre_build_image: true
    override_command: false   # keep the image's own CMD: systemd as PID 1
    systemd: always
    network: elastic_agent_default  # created by the driver from the first platform
    groups: [elasticsearch]

  - name: agent-default-kb
    image: "docker.io/almalinux/${MOLECULE_EL:-9}-init:latest"
    pre_build_image: true
    override_command: false
    systemd: always
    network: elastic_agent_default
    groups: [kibana]

  - name: agent-default-fleet
    image: "docker.io/almalinux/${MOLECULE_EL:-9}-init:latest"
    pre_build_image: true
    override_command: false
    systemd: always
    network: elastic_agent_default
    groups: [fleet_server]

  - name: agent-default-agent1
    image: "docker.io/almalinux/${MOLECULE_EL:-9}-init:latest"
    pre_build_image: true
    override_command: false
    systemd: always
    network: elastic_agent_default
    groups: [elastic_agent, test_agent_mtls]

  - name: agent-default-agent2
    image: "docker.io/almalinux/${MOLECULE_EL:-9}-init:latest"
    pre_build_image: true
    override_command: false
    systemd: always
    network: elastic_agent_default
    groups: [elastic_agent, test_agent_token]

provisioner:
  name: ansible
  inventory:
    links:
      group_vars: inventory/group_vars/

verifier:
  name: ansible

scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - check
    - side_effect
    - verify
    - destroy
